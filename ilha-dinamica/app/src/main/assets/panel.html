<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ilha Dinâmica</title>
<style>
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;src:url(figtree.woff2) format('woff2')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#ECEDE8;color:#17181A;font-family:Figtree,system-ui,sans-serif}
body{padding:28px 16px 40px}
.cb{border:0;cursor:pointer;font:inherit;outline:none}
.cb:active{transform:scale(.97)}
.lbl{font-size:13px;font-weight:700;color:#5C6066}
.sec{display:flex;flex-direction:column;gap:12px}
.card{background:#F7F7F4;border-radius:18px;box-shadow:inset 0 0 0 1.5px #D2D3CD;padding:14px 16px;display:flex;align-items:center;gap:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{height:40px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:#17181A;height:28px}
.row{display:flex;gap:10px;font-size:14px;line-height:1.5;color:#3F4247}
.row b{font-weight:800;color:#17181A;width:86px;flex:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="preact-htm.js"></script>
<script src="panel.js"></script>
</body>
</html>
