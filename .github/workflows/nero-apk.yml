name: Nero APK

on:
  push:
    paths:
      - "nero-app/**"
      - ".github/workflows/nero-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nero-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore image assets
        run: bash restore-assets.sh

      - name: Fetch fonts
        run: bash fetch-fonts.sh

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Nero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nero-apk
          path: nero-app/Nero.apk
