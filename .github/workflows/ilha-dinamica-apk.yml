name: Ilha Dinâmica — APK

on:
  push:
    paths:
      - "ilha-dinamica/**"
      - ".github/workflows/ilha-dinamica-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ilha-dinamica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk IlhaDinamica.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IlhaDinamica-apk
          path: ilha-dinamica/IlhaDinamica.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ilha-v1.0.${{ github.run_number }}
          name: Ilha Dinâmica 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ilha-dinamica/IlhaDinamica.apk
          body: |
            APK da Ilha Dinâmica (bolha da câmera) gerado a partir do branch `${{ github.ref_name }}`.
            Baixe o arquivo **IlhaDinamica.apk** abaixo e instale no Android (8.0 ou mais novo).
