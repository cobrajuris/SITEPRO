name: Ilha Dinâmica — APK

on:
  push:
    paths:
      - "ilha-dinamica/**"
      - ".github/workflows/ilha-dinamica-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ilha-dinamica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk IlhaDinamica.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ilha-dinamica/IlhaDinamica.apk

  test:
    name: Testar no emulador Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar o teste no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ilha-dinamica/ci/emulator-test.sh IlhaDinamica.apk capturas
      - name: Guardar capturas e logs
        if: always()
        run: zip -qr capturas-do-teste.zip capturas || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-do-teste
          path: capturas-do-teste.zip
      - name: Publicar capturas do último teste (mesmo se falhar)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ilha-testes
          name: Capturas dos testes automáticos
          prerelease: true
          make_latest: false
          files: capturas-do-teste.zip
          body: Capturas de tela e logs do último teste automático da Ilha Dinâmica no emulador Android.

  release:
    name: Publicar
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: actions/download-artifact@v4
        with:
          name: capturas-do-teste
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ilha-v1.1.${{ github.run_number }}
          name: Ilha Dinâmica 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            IlhaDinamica.apk
            capturas-do-teste.zip
          body: |
            APK da Ilha Dinâmica (bolha da câmera), **testado automaticamente num emulador Android 14**
            com câmera furada: todas as abas, toques, notificação de grupo com foto, renderizador
            encerrado à força, rotação de tela e comandos em sequência — sem nenhum crash.

            Baixe o **IlhaDinamica.apk** abaixo e instale no Android 8.0 ou mais novo.
            As capturas do teste estão em `capturas-do-teste.zip`.
